<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Face Model Bake</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
  canvas { max-width: 100%; border: 1px solid #333; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>얼굴 모델 bake (MediaPipe Face Landmarker → assets/face-landmarks.json)</h1>
<p>사진에서 478개 3D 랜드마크(홍채 포함)를 추출합니다. 결과 JSON은 <code>window.bakeResult</code>와 아래 텍스트로 확인할 수 있습니다.</p>
<canvas id="c"></canvas>
<pre id="log">loading…</pre>
<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const log = (m) => (document.getElementById("log").textContent = m);
const src = new URLSearchParams(location.search).get("src") || "../assets/face.webp";

const img = new Image();
img.src = src;
await img.decode();

const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
const landmarker = await FaceLandmarker.createFromOptions(fileset, {
  baseOptions: {
    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
  },
  runningMode: "IMAGE",
  numFaces: 1,
  outputFaceBlendshapes: true,
});

// 투명 배경 PNG/WebP는 흰 배경에 합성한 뒤 검출한다.
const W = img.naturalWidth, H = img.naturalHeight;
const cv = document.getElementById("c");
cv.width = W; cv.height = H;
const ctx = cv.getContext("2d");
ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
ctx.drawImage(img, 0, 0);

const result = landmarker.detect(cv);
if (!result.faceLandmarks.length) { log("얼굴을 찾지 못했습니다."); throw new Error("no face"); }
const lm = result.faceLandmarks[0];

// x,y: 픽셀, z: x와 같은 스케일(px), 카메라 쪽이 +가 되도록 부호 반전
const points = lm.map((p) => [+(p.x * W).toFixed(2), +(p.y * H).toFixed(2), +(-p.z * W).toFixed(2)]);
const restBlendshapes = Object.fromEntries(result.faceBlendshapes[0].categories.map((c) => [c.categoryName, +c.score.toFixed(3)]));

ctx.fillStyle = "#0f0";
for (const [x, y] of points) ctx.fillRect(x - 1.5, y - 1.5, 3, 3);

window.bakeResult = { image: "assets/face.webp", width: W, height: H, points, restBlendshapes };
log(JSON.stringify({ count: points.length, width: W, height: H }));
</script>
</body>
</html>
